<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F2FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006AFF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Hexagon Border -->
  <path d="M128 20L213.85 68V188L128 236L42.15 188V68L128 20Z" 
        stroke="url(#grad1)" 
        stroke-width="12" 
        fill="none" 
        stroke-linejoin="round"/>

  <!-- Terminal Prompt Symbol -->
  <path d="M80 110L110 128L80 146" 
        stroke="url(#grad1)" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  <line x1="120" y1="146" x2="160" y2="146" 
        stroke="url(#grad1)" 
        stroke-width="14" 
        stroke-linecap="round"/>

  <!-- AI Spark/Node -->
  <circle cx="180" cy="70" r="12" fill="#00F2FF">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="180" cy="70" r="20" stroke="#00F2FF" stroke-width="2" fill="none">
    <animate attributeName="r" values="20;30" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
